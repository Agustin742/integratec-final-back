name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - test
      - main
  push:
    branches:
      - develop

jobs:
  # Static Terraform checks only: no AWS credentials, no remote state, no plan.
  # Every root module (directory with a versions.tf) under infra/ must be listed;
  # scripts/ci/test_checks.py enforces it.
  terraform:
    name: terraform (${{ matrix.root }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/bootstrap
          - infra/envs/prod
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform test
        run: terraform test -no-color

  checks:
    name: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aula_virtual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aula_virtual_test?schema=public
      # Local MinIO started by the "Start MinIO" step; placeholder credentials, not secrets.
      S3_BUCKET: aula-virtual-dev
      S3_REGION: sa-east-1
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin

    steps:
      - name: Enforce promotion source branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE_REF:$HEAD_REF" in
            develop:*|test:develop|main:test) ;;
            *)
              echo "Pull requests into '$BASE_REF' must come from the promotion branch (got '$HEAD_REF')." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check documentation and CI regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/ci/check_docs.py

      - name: Check proposed diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base=$(git hash-object -t tree /dev/null)
          else
            base="$PUSH_BEFORE"
          fi
          git diff --check "$base" HEAD --

      - name: Validate workflow with actionlint 1.7.7
        env:
          GOBIN: ${{ runner.temp }}
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$GOBIN/actionlint" .github/workflows/ci.yml

      - name: Detect backend package
        id: package
        shell: bash
        run: |
          if [[ -f package.json && ! -f pnpm-lock.yaml ]]; then
            echo "package.json exists, but pnpm-lock.yaml is missing; CI requires the pnpm lockfile." >&2
            exit 1
          fi
          if [[ -f package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        if: steps.package.outputs.present == 'true'
        run: corepack enable

      - name: Set up Node.js 22
        if: steps.package.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.package.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['prisma:migrate:deploy'] || require('./apps/api/package.json').scripts?.['prisma:migrate:deploy'] ? 0 : 1)"; then
            pnpm prisma:generate
            pnpm prisma:migrate:deploy
            pnpm prisma:migrate:deploy
            pnpm prisma:seed
          else
            echo "::notice title=Prisma migrations not configured::No prisma:migrate:deploy script configured; step skipped."
          fi

      - name: Check committed OpenAPI document is up to date
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          pnpm openapi:export
          if ! git diff --exit-code -- apps/api/openapi.json; then
            echo "::error title=openapi.json is stale::apps/api/openapi.json does not match the code. Run 'pnpm openapi:export' and commit the result." >&2
            exit 1
          fi

      - name: Code formatting
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['format:check'] ? 0 : 1)"; then
            pnpm format:check
          else
            echo "::notice title=Format not configured::Formatting check script is not configured; step skipped."
            {
              echo '## Format not configured'
              echo "No \`format:check\` script is configured in \`package.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Code linting
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            pnpm lint
          else
            echo "::notice title=Lint not configured::Linting script is not configured; step skipped."
            {
              echo '## Lint not configured'
              echo "No \`lint\` script is configured in \`package.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Typecheck
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            pnpm typecheck
          else
            echo "::notice title=Typecheck not configured::No typecheck script is configured; step skipped."
            {
              echo '## Typecheck not configured'
              echo "No \`typecheck\` script is configured in \`package.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A service container cannot take a command, so MinIO comes from the same
      # Compose definitions used locally: `--wait` blocks until the health check
      # passes and `run minio-init` creates the bucket (retrying until MinIO is ready).
      - name: Start MinIO and create the test bucket
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          docker compose up -d --wait minio
          docker compose run --rm minio-init

      - name: Run tests
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "::notice title=Tests not configured::No test script is configured; no tests were run."
            {
              echo '## Tests not configured'
              echo "No \`test\` script is configured in \`package.json\`; no tests were run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build packages
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            pnpm build
          else
            echo "::notice title=Build not configured::No build script is configured; step skipped."
            {
              echo '## Build not configured'
              echo "No \`build\` script is configured in \`package.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report docs-only backend
        if: steps.package.outputs.present == 'false'
        shell: bash
        run: |
          echo "::notice title=Tests not configured::No package.json or test script is present; no tests were run."
          {
            echo '## Tests not configured'
            echo "This backend has no \`package.json\` or test script; no tests were run."
          } >> "$GITHUB_STEP_SUMMARY"
