name: aula-virtual

services:
  postgres:
    image: postgres:16-alpine
    container_name: aula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aula_virtual}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aula_virtual}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aula-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aula_virtual}?schema=public
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      INVITATION_TTL: ${INVITATION_TTL:-7d}
    ports:
      - '127.0.0.1:3000:3000'
    profiles:
      - app

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    container_name: aula-realtime
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 2567
      API_INTERNAL_URL: http://api:3000
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    ports:
      - '127.0.0.1:2567:2567'
    profiles:
      - app

volumes:
  postgres_data:
    name: aula_postgres_data
