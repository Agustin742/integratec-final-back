# Production stack of the EC2 host (issue #61): Caddy in front of the api and realtime services, with a
# one-shot migrate service that applies the database migrations before the api starts (issue #58).
#
# Do not run `docker compose up` on this file by hand. Use infra/deploy/start-app.sh, which reads the
# secrets (Secrets Manager) and the config (SSM Parameter Store), logs in to ECR and starts the stack.
# Every value that reaches a container comes from the process environment of that one `docker compose`
# run, so this file holds no value of any secret and no .env file ever exists. Environment entries
# written as a bare name (`- JWT_SECRET`) pass the shell value through, like `docker run -e`.
#
# Host layout: this file and ../caddy/Caddyfile keep their relative position (the Caddyfile is
# mounted from there), for example /opt/aula/infra/deploy and /opt/aula/infra/caddy.
#
# Inputs set by the start script:
#   API_IMAGE, REALTIME_IMAGE, MIGRATE_IMAGE
#                              full ECR image URI with tag (the pipeline, issue #58, owns the tags)
#   SITE_ADDRESS               public host name Caddy serves (output host_sslip_domain)
#   AWS_REGION                 region of the CloudWatch log groups
#   LOG_GROUP_PREFIX           `/<name_prefix>`, so the groups are /<name_prefix>/{caddy,api,realtime}
# plus the application variables listed per service below. Only the api and the migrate job get the
# database URL; the realtime service lists its own variables only, so nothing else in the shared
# environment reaches it.
#
# migrate runs `prisma migrate deploy` and exits. start-app.sh runs it first on its own
# (`docker compose run --rm --no-deps migrate`) and aborts before `up` when it fails, so a failed
# migration leaves the previous api running. `up` recreates containers before starting them, so the
# api's depends_on (service_completed_successfully) is only a second guard, a no-op when nothing is
# pending. Prisma serializes concurrent runs with a database advisory lock. Its logs go to the api log
# group under their own stream prefix.
#
# Logs go to CloudWatch through the Docker awslogs driver with the host's instance role. The log
# groups and their retention are created by Terraform (module runtime_access), so the driver never
# creates groups. Non-blocking mode drops log lines instead of stalling a service when CloudWatch is
# unreachable.
#
# Only Caddy publishes ports, and only the TCP ports the host security group opens. The services
# reach each other by service name on the one private bridge network. Container ports match the
# Caddyfile upstreams (api:3000, realtime:2567) and the internal URLs stored in SSM.
name: aula-virtual

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?SITE_ADDRESS is required}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: ${LOG_GROUP_PREFIX:?LOG_GROUP_PREFIX is required}/caddy
        tag: '{{.Name}}'
        mode: non-blocking
        max-buffer-size: 4m

  api:
    image: ${API_IMAGE:?API_IMAGE is required (full ECR image URI with tag)}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ALLOWED_ORIGINS
      - PASSWORD_RESET_URL_BASE
      - S3_REGION
      - S3_BUCKET
      - REALTIME_INTERNAL_URL
      - JWT_SECRET
      - INVITATION_TOKEN_KEY
      - INTERNAL_SERVICE_SECRET
      - DATABASE_URL
    networks:
      - private
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: ${LOG_GROUP_PREFIX:?LOG_GROUP_PREFIX is required}/api
        tag: '{{.Name}}'
        mode: non-blocking
        max-buffer-size: 4m

  migrate:
    image: ${MIGRATE_IMAGE:?MIGRATE_IMAGE is required (full ECR image URI with tag)}
    restart: 'no'
    environment:
      - DATABASE_URL
    networks:
      - private
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: ${LOG_GROUP_PREFIX:?LOG_GROUP_PREFIX is required}/api
        tag: 'migrate/{{.Name}}'
        mode: non-blocking
        max-buffer-size: 4m

  realtime:
    image: ${REALTIME_IMAGE:?REALTIME_IMAGE is required (full ECR image URI with tag)}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=2567
      - API_INTERNAL_URL
      - INTERNAL_SERVICE_SECRET
    networks:
      - private
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:2567/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?AWS_REGION is required}
        awslogs-group: ${LOG_GROUP_PREFIX:?LOG_GROUP_PREFIX is required}/realtime
        tag: '{{.Name}}'
        mode: non-blocking
        max-buffer-size: 4m

networks:
  private:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
